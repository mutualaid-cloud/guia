<!-- sentido.html -->
<div id="cont-step-5" class="step-content">
    <div class="intro-box-sobria">
        <h1 class="page-main-title">5. En Busca del Sentido</h1>
        <p class="texto-guia-sobrio">Visibiliza tus valores proyectados en una persona a la que respetas profundamente.</p>
    </div>

    <div style="max-width: 750px; margin: 0 auto;">
        <input type="text" id="p5_nombre_admirado" class="caja-reflexion" placeholder="Nombre de la persona admirada...">
        <textarea id="p5_reflexion_compromiso" class="caja-reflexion" placeholder="Tu compromiso de acción concreta..."></textarea>
        
        <div class="text-center" style="margin-top: 2rem;">
            <button class="btn btn-guia-delicado" onclick="enviarBusquedaSentido(this)">💾 Guardar Actividad Final</button>
        </div>
    </div>

    <div class="sentido-interactive-wrapper" style="margin-top: 40px;">
        <div class="sentido-card">
            <label class="sentido-label">Comodidad Fáctica</label>
            <textarea class="form-control custom-textarea-sentido" id="ans_comodidad" placeholder="Lo que te ataca o arrastra..."></textarea>
        </div>
        <div class="sentido-card">
            <label class="sentido-label">Toma de Postura</label>
            <textarea class="form-control custom-textarea-sentido" id="ans_postura" placeholder="Tu poder de elegir..."></textarea>
        </div>
        <div class="sentido-card highlight-card">
            <label class="sentido-label">Compromiso Definitivo</label>
            <textarea class="form-control custom-textarea-sentido" id="ans_compromiso" placeholder="Mi compromiso es..."></textarea>
        </div>
    </div>

    <div class="text-center" style="margin-top: 2rem;">
        <button class="btn btn-guia-delicado" onclick="enviarSentido(this)">💾 Guardar Registro de El Sentido</button>
    </div>
</div>
