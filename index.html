<!DOCTYPE html>
<html lang="es">
<head>
    <base target="_top"> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Camino hacia Mí</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Estilo.css">
</head>
<body>
    
    <!-- PANTALLA DE LOGIN -->
    <div id="login-view">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 20px;">
                <img src="https://iili.io/fJEHMZu.png" alt="Logo" style="width: 80px; height: auto;">
            </div>
            <h2 style="color: var(--color-primary); font-family: 'Caveat'; font-size: 2.5rem; margin-bottom: 10px;">"El Camino hacia Mí"</h2>
            <p>Ingresa tu Nº de Legajo</p>
            
            <input type="text" id="input-legajo" class="legajo-input" placeholder="EJ: ABC123" onkeyup="if(event.key === 'Enter') verificarLegajo()">
            
            <div id="login-error" style="color: #e53e3e; display: none; margin-bottom: 15px; font-size: 0.9rem;">
                Legajo no encontrado. Intenta de nuevo.
            </div>
            
            <button class="btn-submit" id="btn-login" onclick="verificarLegajo()">
                Entrar a la Guía
            </button>
        </div>
    </div> 

    <!-- CONTENIDO PRINCIPAL DE LA APLICACIÓN -->
    <div id="app-content" style="display:none;">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfsLbyL4ux2DklWfdSayQilnUOQ4gNuvlHKxL-r4D8f31XU4A/viewform?usp=header" 
           target="_blank" class="floating-calendar left-corner" title="Agendar Consulta">📅</a>
        
        <img src="https://iili.io/fJEHMZu.png" class="app-logo right-corner" alt="Logo">

        <div class="container">
            <div class="main-nav">
                <button class="nav-btn active" id="btn-guide" onclick="showView('guide')">Guía Proceso</button>
                <button class="nav-btn" id="btn-log" onclick="showView('log')">Logodiario</button>
            </div>

            <div class="legajo-badge">
                👤 Legajo Activo: <strong><span id="display-legajo">---</span></strong>
            </div>

            <!-- CONTENEDORES DE VISTAS -->
            <div id="log-diario-view" style="display:none;"></div>
            <div id="guide-view"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function() {
          if (typeof iniciarPagina === 'function') {
              iniciarPagina();
          }
      });
    </script>
</body>
</html>
