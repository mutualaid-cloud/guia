<div id="cont-step-3" class="step-content">
    <div class="intro-box-sobria">
        <h1 class="page-main-title">3. La Vida Que Me Moldea</h1>
        <p class="texto-guia-sobrio">Escribe tres situaciones vividas en el pasado relatadas en tercera persona...</p>
    </div>

    <h3 class="activity-sub-title">Actividad Práctica: "¿Cómo ves tu sufrimiento?"</h3>

    <div class="comic-wrapper">
        <img src="https://iili.io/BZlAoKl.gif" alt="Cómic Autodistanciamiento" class="comic-bg">
        
        <div class="comic-overlay-inputs">
            <div class="comic-textarea-holder marco-comic v-1">
                <textarea id="comic-situacion" placeholder="Cuenta una situación triste de esa persona..."></textarea>
            </div>
            <div class="comic-textarea-holder marco-comic v-2">
                <textarea id="comic-desesperacion" placeholder="Relata un momento de desesperación..."></textarea>
            </div>
            <div class="comic-textarea-holder marco-comic v-3">
                <textarea id="comic-superacion" placeholder="¿Cómo hizo para llegar hasta aquí a pesar de todo?"></textarea>
            </div>
        </div>
    </div>

    <div style="text-align: center; margin-top: 25px; margin-bottom: 40px;">
        <button class="btn btn-guia-delicado" onclick="enviarActividad4(this)">💾 Guardar Situaciones</button>
    </div>

    <!-- Sección Yo Soy / Yo Puedo Ser -->
    <div style="max-width: 720px; margin: 0 auto;">
        <div style="background-image: url('https://iili.io/CuXvqUx.png'); min-height: 400px; padding: 85px 60px 45px 60px; margin-bottom: 35px;">
            <label style="font-weight: 700; color: #5c4033;">🟫 Yo soy:</label>
            <textarea id="ans_yo_soy" placeholder="Completa la frase aquí..."></textarea>
        </div>

        <div style="background-image: url('https://iili.io/CuXSX94.png'); min-height: 400px; padding: 85px 60px 45px 60px; margin-bottom: 40px;">
            <label style="font-weight: 700; color: #b45309;">🌻 Yo puedo ser:</label>
            <textarea id="ans_yo_puedo_ser" placeholder="Completa la frase aquí..."></textarea>
        </div>

        <div style="text-align:center;">
            <button class="btn btn-guia-delicado" onclick="ActividadYoSoy()">💾 Guardar Actividad</button>
        </div>
    </div>
</div>
