<div id="cont-step-4" class="step-content">
    <div class="intro-box-sobria">
        <h1 class="page-main-title">4. La Autotrascendencia</h1>
        <p class="texto-guia-sobrio">Profundiza en tu sentido de trascendencia y conexión con los demás.</p>
    </div>

    <div class="px-2" style="margin-top: 30px;">
        <div class="mb-5">
            <label class="form-label d-block mb-1" style="color: #8c7851; font-weight: bold;">👣 La pregunta por tu huella:</label>
            <textarea class="caja-reflexion" id="ans_huella" placeholder="Escribe aquí tu reflexión..."></textarea>
        </div>

        <div class="mb-5">
            <label class="form-label d-block mb-1" style="color: #8c7851; font-weight: bold;">🤝 La pregunta por el otro:</label>
            <textarea class="caja-reflexion" id="ans_otro" placeholder="Escribe aquí tu reflexión..."></textarea>
        </div>

        <div class="mb-5">
            <label class="form-label d-block mb-1" style="color: #8c7851; font-weight: bold;">✨ La pregunta por la movilización:</label>
            <textarea class="caja-reflexion" id="ans_movilizacion" placeholder="Escribe aquí tu reflexión..."></textarea>
        </div>

        <div class="text-center" style="margin-top: 3rem;">
            <button class="btn btn-guia-delicado" onclick="enviarAutotrascendencia(this)">💾 Guardar Respuestas</button>
        </div>
    </div>
</div>
