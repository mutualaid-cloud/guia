<!-- Logodiario.html -->
<div class="card">
    <h2 style="text-align:center; color:var(--color-primary); margin-bottom: 25px;">☀️ Mi Registro Diario</h2>
    
    <div id="log-fields-container"></div>
    
    <div class="section-card">
       <h3>📝 ¿Cómo te sientes hoy?</h3>
       <span class="sub-pregunta">Expresa brevemente tu estado emocional general del día…</span>
       <textarea id="emocion-text-log" style="width:100%; height:120px; border-radius:12px; border:1px solid #ddd; padding:15px; font-family: 'Poppins'; margin-top:15px; resize: none;" placeholder="¿Qué hubo de significativo de este día? &#10;¿Un momento especial?&#10;¿Una compañía especial? &#10;¿Tal vez un conflicto o adversidad que te afectaron? &#10;¿Cuál fue tu actitud ante ellos?"></textarea>
    </div>
    
    <button class="btn btn-guia-delicado" onclick="enviarLogodiario(this)">Enviar Logodiario</button>
</div>
